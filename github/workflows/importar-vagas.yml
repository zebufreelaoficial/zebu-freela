name: Importar Vagas Jooble

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar firebase-admin
        run: npm install --no-save --no-package-lock firebase-admin

      - name: Buscar vagas da Jooble
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/importar-jooble.js

<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zebu Freela | Uberaba</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            zebu: {
              green: '#000000',
              cream: '#FFFFFF',
              brown: '#18181B',
              mustard: '#C69214'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Estilo carrossel mobile sem barra de rolagem feia */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-neutral-50 text-neutral-900 dark:bg-black dark:text-neutral-100 min-h-screen flex flex-col font-sans transition-colors duration-200 pb-20 md:pb-6">

  <!-- ================= NAVBAR SUPERIOR ================= -->
  <header class="sticky top-0 z-40 bg-black text-white shadow-sm border-b border-neutral-800">
    <div class="max-w-7xl mx-auto px-4 h-14 md:h-16 flex items-center justify-between">
      <a href="#" onclick="showSection('home')" class="flex items-center gap-2">
        <img src="WhatsApp Image 2026-10-23 at 18.27.58.jpeg" alt="Zebu Freela" class="h-9 md:h-12 w-auto object-contain bg-white px-2 py-1 rounded">
      </a>

      <!-- Menu no Computador / Tablet -->
      <nav class="hidden md:flex items-center gap-5 text-xs font-bold uppercase tracking-wider">
        <button onclick="showSection('home')" class="hover:text-amber-400 transition">Início</button>
        <button onclick="goToExplore()" class="hover:text-amber-400 transition">Buscar</button>
        <button onclick="showSection('blog')" class="text-amber-400 flex items-center gap-1"><i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i> Dicas & Produtos</button>
      </nav>

      <div class="flex items-center gap-1.5 md:gap-2">
        <button id="themeToggle" class="p-2 rounded-full hover:bg-neutral-800 transition" title="Alternar tema">
          <i data-lucide="moon" class="w-4 h-4 md:w-5 md:h-5 hidden dark:block text-white"></i>
          <i data-lucide="sun" class="w-4 h-4 md:w-5 md:h-5 block dark:hidden text-white"></i>
        </button>

        <div id="authNavButtons" class="flex items-center gap-1.5">
          <button onclick="openModal('authModal', 'login')" class="px-2.5 py-1 md:px-3 md:py-1.5 rounded-lg text-xs md:text-sm font-semibold hover:bg-neutral-800 transition text-white">
            Entrar
          </button>
          <button onclick="openModal('authModal', 'register')" class="px-3 py-1 md:px-4 md:py-1.5 bg-white text-black hover:bg-neutral-200 font-extrabold text-xs md:text-sm rounded-lg transition shadow">
            Cadastrar
          </button>
        </div>

        <div id="userNavMenu" class="hidden relative flex items-center gap-1.5">
          <button id="adminPostBtn" onclick="openModal('adminProductModal')" class="hidden items-center gap-1 text-[11px] md:text-xs bg-amber-400 text-black px-2.5 py-1 rounded-md font-black hover:bg-amber-300">
            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> + Produto
          </button>
          <button onclick="logoutUser()" class="p-2 rounded-full hover:bg-neutral-800 transition text-neutral-400 hover:text-white" title="Sair">
            <i data-lucide="log-out" class="w-4 h-4 md:w-5 md:h-5"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- NOTIFICAÇÃO TOAST -->
  <div id="toast" class="fixed top-4 left-4 right-4 md:left-auto md:right-4 z-50 transform -translate-y-24 opacity-0 transition-all duration-300 max-w-sm w-full mx-auto bg-black text-white p-3.5 rounded-xl shadow-2xl flex items-start gap-3 border border-neutral-700">
    <i id="toastIcon" data-lucide="info" class="w-5 h-5 shrink-0 text-white mt-0.5"></i>
    <p id="toastMessage" class="text-xs md:text-sm font-medium leading-snug"></p>
  </div>

  <!-- CORPO PRINCIPAL -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3.5 py-4 md:p-6 space-y-6 md:space-y-8">

    <!-- SEÇÃO HOME -->
    <section id="homeSection" class="space-y-6 md:space-y-10">
      
      <!-- HERO MOBILE-FIRST -->
      <div class="relative bg-black text-white rounded-2xl md:rounded-3xl p-5 md:p-12 overflow-hidden shadow-xl border border-neutral-800">
        <div class="max-w-2xl space-y-3 md:space-y-4">
          <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] md:text-xs font-extrabold bg-neutral-900 text-amber-400 border border-neutral-700 uppercase tracking-wider">
            <i data-lucide="map-pin" class="w-3 h-3"></i> Uberaba - MG
          </span>
          <h1 class="text-2xl md:text-5xl font-black tracking-tight leading-tight">Qual serviço você precisa hoje?</h1>
          <p class="text-neutral-400 text-xs md:text-base leading-relaxed">Contrate autônomos de confiança perto de você ou anuncie seu trabalho em Uberaba.</p>

          <!-- Barra de Busca -->
          <div class="pt-1 flex flex-col sm:flex-row gap-2">
            <div class="relative flex-1">
              <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3 text-neutral-400"></i>
              <input type="text" id="homeSearchInput" placeholder="Ex: Diarista, Eletricista, Manicure..." 
                class="w-full pl-10 pr-3 py-2.5 rounded-xl bg-neutral-900 border border-neutral-700 text-white placeholder-neutral-500 focus:outline-none focus:ring-1 focus:ring-white text-xs md:text-sm"
                onkeydown="if(event.key === 'Enter') handleQuickSearch()">
            </div>
            <button onclick="handleQuickSearch()" class="px-5 py-2.5 bg-white text-black font-extrabold text-xs md:text-sm rounded-xl hover:bg-neutral-200 transition shadow">
              Buscar
            </button>
          </div>

          <div class="pt-2 flex flex-wrap gap-2">
            <button onclick="goToExplore()" class="flex-1 sm:flex-none px-3.5 py-2 bg-white text-black font-bold rounded-xl text-xs hover:bg-neutral-200 transition flex items-center justify-center gap-1.5 shadow">
              <i data-lucide="users" class="w-3.5 h-3.5"></i> Encontrar profissionais
            </button>
            <button onclick="handleAdvertiseClick()" class="flex-1 sm:flex-none px-3.5 py-2 bg-neutral-900 text-white border border-neutral-700 font-bold rounded-xl text-xs hover:bg-neutral-800 transition flex items-center justify-center gap-1.5">
              <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> Anunciar grátis
            </button>
          </div>
        </div>
      </div>

      <!-- CATEGORIAS: CARROSSEL NO CELULAR / GRID NO TABLET -->
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-base md:text-xl font-black flex items-center gap-1.5">
            <i data-lucide="layout-grid" class="w-4 h-4 md:w-5 md:h-5"></i> Categorias
          </h2>
          <button onclick="goToExplore()" class="text-xs font-bold underline hover:opacity-75">Ver todas</button>
        </div>
        <!-- Carrossel deslizável horizontal com o dedo -->
        <div id="categoriesGrid" class="flex md:grid md:grid-cols-6 gap-2.5 overflow-x-auto no-scrollbar py-1"></div>
      </div>

      <!-- DESTAQU
